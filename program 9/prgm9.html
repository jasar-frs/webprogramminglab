<html>
<head>
<title>Mouse Event</title>
</head>
<body style="text-align:center;">
<h2>Mouse Handling</h2>
<img id="img-tag"src="https://media.istockphoto.com/id/998390080/photo/lavender-field-at-sunset.jpg?s=612x612&w=0&k=20&c=-4KuH9Rho29rxPSJZIZoKNL5XGBp7N_MaXD-aBxW_E8=" onmouseover="changeImg()" onmouseout="setOld()" width="220px" height="230px" alt="image1">
<p id="msg">Move the mouse over the image</p>
<script>
function changeImg(){
document.getElementById("img-tag").src="https://media.istockphoto.com/id/485371557/photo/twilight-at-spirit-island.jpg?s=612x612&w=0&k=20&c=FSGliJ4EKFP70Yjpzso0HfRR4WwflC6GKfl4F3Hj7fk=";
document.getElementById("msg").innerHTML="New image displayed!";
}
function setOld(){
document.getElementById("img-tag").src="https://media.istockphoto.com/id/998390080/photo/lavender-field-at-sunset.jpg?s=612x612&w=0&k=20&c=-4KuH9Rho29rxPSJZIZoKNL5XGBp7N_MaXD-aBxW_E8=";
document.getElementById("msg").innerHTML="Move the mouse over the image";
}
</script>
</body>
</html>
