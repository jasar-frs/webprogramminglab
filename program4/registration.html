<html>
<head>
<title>Registration form</title>
<style>
body {
 background-color:lightblue;
 width:700px;
 margin:auto;
 }
 td{
 padding:10px;
 }
 </style>
 </head>
 <body class="form">
 <h2 align="center">Registration form </h2>
 <form>
 <table>
 <tr>
 <td>Full Name</td>
 <td><input type="text"></td>
 </tr>
 <tr>
 <td>Mobile Number</td>
 <td><input type="text"></td>
 </tr>
 <tr>
 <td>Email id</td>
 <td><input type="email"></td>
 </tr>
 <tr>
 <td>Age</td>
 <td><input type="number"></td>
 </tr>
 <tr>
 <td>Gender</td>
 <td><input type="radio" name="gender">Male
 <input type="radio" name="gender">Female
 <input type="radio" name="gender">others
 </td>
 </tr>
 <tr>
 <td>Date of Birth</td>
 <td><input type="date"></td>
 </tr>
 <tr>
 <td>Address</td>
 <td><textarea rows="7" cols="30"></textarea></td>
 </tr>
 <tr>
 <td>Current Study</td>
 <td>
 <select>
 <option>B.tech</option>
 <option>MCA</option>
 <option>Bsc</option>
 <option>M.tech</option>
 </select>
 </td>
 </tr>
 <tr>
 <td>Department</td>
 <td>
 <select>
 <option>CS</option>
 <option>EC</option>
 <option>EEE</option>
 <option>ME</option>
 </select>
 </td>
 </tr>
 <tr>
 <td>Upload CV</td>
 <td><input type="file"></td>
 </tr>
 <tr>
 <td>Programming Language</td>
 <td>
 <input type="checkbox">HTML
 <input type="checkbox">Reactjs
 <input type="checkbox">CSS
 <input type="checkbox">Flutter
 </td>
 </tr>
 <tr>
 <td>Language</td>
 <td>
 <input type="checkbox">English
 <input type="checkbox">Malayalam
 <input type="checkbox">Arabic
 <input type="checkbox">Hindi
 </td>
 <tr>
 <td>
 <input type="submit" value="submit">
 </td>
 <td>
 <input type="reset" value="reset">
 </td>
 </tr>
 </table>
 </form>
 </body>
 </html>
